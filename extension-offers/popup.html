<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PointWise Offers</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 340px; margin: 12px; color: #0f172a; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin: 8px 0 2px; font-weight: 600; }
      input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 6px; }
      button { margin-top: 10px; padding: 7px 12px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
      button[hidden] { display: none; }
      #enroll { background: #0f766e; margin-left: 6px; }
      #status { margin-top: 10px; padding: 6px; border-radius: 6px; }
      #status.ok { background: #dcfce7; } #status.error { background: #fee2e2; } #status.info { background: #f1f5f9; }
      .note { font-size: 12px; color: #334155; margin: 6px 0; }
    </style>
  </head>
  <body>
    <h1>PointWise Offers</h1>
    <p><strong id="issuer"></strong></p>
    <p class="note" id="note"></p>
    <label for="server">Your PointWise address</label>
    <input id="server" type="text" placeholder="https://pointwise.example" autocomplete="off" />
    <label for="token">Extension token</label>
    <input id="token" type="password" placeholder="pw_pat_…" autocomplete="off" />
    <label for="account">PointWise account id</label>
    <input id="account" type="text" placeholder="From Offer Automation → Accounts" autocomplete="off" />
    <label for="lastfour">Card last four (optional)</label>
    <input id="lastfour" type="text" maxlength="5" autocomplete="off" />
    <label><input id="ack" type="checkbox" /> I have read the note above about this issuer's terms.</label>
    <button id="capture" type="button">Capture this page</button>
    <button id="enroll" type="button" hidden>Enroll selected</button>
    <p class="note" id="queue"></p>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
